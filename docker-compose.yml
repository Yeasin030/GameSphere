version: '3.9'

networks:
  gamesphere:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  minio_data:
  composer_cache:

services:
  # ─── Nginx ─────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: gs_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./backend:/var/www/backend
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - ./docker/nginx/ssl:/etc/nginx/ssl
    depends_on:
      - php
      - next
    networks:
      - gamesphere

  # ─── PHP-FPM (Laravel) ─────────────────────────────────────────────
  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: gs_php
    restart: unless-stopped
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
      - composer_cache:/root/.composer
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      - PHP_OPCACHE_ENABLE=1
    depends_on:
      - mysql
      - redis
    networks:
      - gamesphere

  # ─── Laravel Horizon (Queue Worker) ────────────────────────────────
  horizon:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: gs_horizon
    restart: unless-stopped
    working_dir: /var/www/backend
    command: php artisan horizon
    volumes:
      - ./backend:/var/www/backend
    depends_on:
      - mysql
      - redis
    networks:
      - gamesphere

  # ─── Laravel Reverb (WebSocket Server) ─────────────────────────────
  reverb:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: gs_reverb
    restart: unless-stopped
    working_dir: /var/www/backend
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "${REVERB_PORT:-8080}:8080"
    volumes:
      - ./backend:/var/www/backend
    depends_on:
      - mysql
      - redis
    networks:
      - gamesphere

  # ─── Laravel Scheduler ─────────────────────────────────────────────
  scheduler:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: gs_scheduler
    restart: unless-stopped
    working_dir: /var/www/backend
    command: php artisan schedule:work
    volumes:
      - ./backend:/var/www/backend
    depends_on:
      - mysql
      - redis
    networks:
      - gamesphere

  # ─── MySQL 8 ───────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: gs_mysql
    restart: unless-stopped
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_DATABASE:-gamesphere}
      MYSQL_USER: ${DB_USERNAME:-gamesphere}
      MYSQL_PASSWORD: ${DB_PASSWORD:-gamesphere_password}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/custom.cnf
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --sql-mode=STRICT_TRANS_TABLES,NO_ZERO_DATE,NO_ZERO_IN_DATE,ERROR_FOR_DIVISION_BY_ZERO
    networks:
      - gamesphere

  # ─── Redis ─────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: gs_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password} --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - gamesphere

  # ─── MinIO (S3-compatible object storage) ──────────────────────────
  minio:
    image: minio/minio:latest
    container_name: gs_minio
    restart: unless-stopped
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - gamesphere

  # ─── MinIO bucket setup (one-shot) ─────────────────────────────────
  minio-setup:
    image: minio/mc:latest
    container_name: gs_minio_setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
        sleep 5;
        mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin123};
        mc mb myminio/gamesphere-media --ignore-existing;
        mc mb myminio/gamesphere-private --ignore-existing;
        mc anonymous set download myminio/gamesphere-media;
        exit 0;
      "
    networks:
      - gamesphere

  # ─── Next.js Frontend ──────────────────────────────────────────────
  next:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: gs_next
    restart: unless-stopped
    ports:
      - "${NEXT_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost/api/v1}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:8080}
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - gamesphere
