[package]
name = "yeasinarafat5331/gamesphere-backend"
version = "0.1.2"
description = "Gamesphere Laravel Backend"

[dependencies]
"php/php" = "^8.3.4"

[fs]
"/app/" = "."

[[command]]
name = "run"
module = "php/php:php"
runner = "wasi"

[command.annotations.wasi]
main-args = ["-t", "/app/public", "-S", "localhost:8080"]
