[package]
name = "yeasinarafat5331/gamesphere-frontend"
version = "0.1.5"
description = "GameSphere Frontend"

[dependencies]
"wasmer/static-web-server" = "^1"

[fs]
public = "out"

[[command]]
name = "script"
module = "wasmer/static-web-server:webserver"
runner = "https://webc.org/runner/wasi"

[command.annotations.wasi]
env = [
  "SERVER_PORT=8080",
  "SERVER_ROOT=/public",
  "SERVER_ERROR_PAGE=/public/404.html",
  "SERVER_FALLBACK_PAGE=/public/index.html"
]
